name: stats292
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  # PyTorch — must come from conda (pytorch channel) to own libomp on macOS arm64
  - pytorch
  # Data & numerics
  - numpy
  - pandas
  - scipy
  - einops
  # Plotting
  - matplotlib
  - seaborn
  # NLP
  - nltk
  # Jupyter
  - jupyterlab
  - ipykernel
  # Google Cloud (BigQuery client + gcloud CLI for auth)
  - google-cloud-sdk
  # R language + Jupyter kernel
  - r-base
  - r-irkernel
  - r-tidyverse
  - r-scales
  - r-remotes
  - pip
  - pip:
      - google-cloud-bigquery[pandas]
      - google-cloud-bigquery-storage
      - db-dtypes
      # HW4/HW5 — TransformerLens interpretability toolkit
      # torch must already be installed via conda before this runs
      - transformer_lens
      - datasets
